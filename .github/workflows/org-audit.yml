# Scan the whole org weekly → update the "Org compliance report" issue.
# Run manually with fix=true to open PRs adopting the standard workflows in repos that lack them.
name: org-audit

on:
  schedule:
    - cron: "43 0 * * 1" # Monday 07:43 Vietnam time (UTC+7)
  workflow_dispatch:
    inputs:
      fix:
        description: Open fix PRs for non-compliant repos
        type: boolean
        default: false
      only:
        description: Only scan these repos (comma-separated); empty = all
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: org-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: GitHub App token (reads every repo in the org)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ORG_AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_AUDIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Is this repo public or private?
        id: vis
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPORT_REPO: ${{ vars.AUDIT_REPORT_REPO }}
        run: |
          vis=$(gh repo view "$REPO" --json visibility --jq .visibility)
          public=$([ "$vis" = "PUBLIC" ] && echo true || echo false)
          # Logs, summaries and artifacts of a public repo are visible to anyone → the report must go to a private repo
          target="$REPORT_REPO"
          [ -z "$target" ] && [ "$public" = "false" ] && target="${REPO#*/}"
          { echo "public=$public"; echo "target=$target"; } | tee -a "$GITHUB_OUTPUT"
          if [ "$public" = "true" ] && [ -z "$target" ]; then
            echo "::warning::This repo is public: set the AUDIT_REPORT_REPO variable (a private repo) to receive the report."
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Audit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ORG: ${{ github.repository_owner }}
          FIX: ${{ inputs.fix || 'false' }}
          ONLY: ${{ inputs.only }}
          GUARD_REF: ${{ vars.HARNESS_REF || 'v1' }}
          PLATFORM_OWNERS: ${{ vars.PLATFORM_OWNERS }}
          QUIET: ${{ steps.vis.outputs.public }}
        run: node scripts/org-audit.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.vis.outputs.public == 'false'
        with:
          name: org-audit-report
          path: report.*
          retention-days: 30

      - name: Update the "Org compliance report" issue
        if: steps.vis.outputs.target != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository_owner }}/${{ steps.vis.outputs.target }}
        run: |
          if [ "$(gh repo view "$REPO" --json visibility --jq .visibility)" = "PUBLIC" ]; then
            echo "::error::The report repo must be private."; exit 1
          fi
          gh label create org-audit --repo "$REPO" --color 5319e7 --description "Org compliance report" 2>/dev/null || true
          n=$(gh issue list --repo "$REPO" --label org-audit --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue edit "$n" --repo "$REPO" --body-file report.md > /dev/null
          else
            gh issue create --repo "$REPO" --title "Org compliance report" --label org-audit --body-file report.md > /dev/null
          fi
          echo "Report updated."
