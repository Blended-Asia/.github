# GitHub Enterprise Cloud only: the "Require workflows to pass" ruleset points at this file
# (see rulesets/org-baseline-enterprise.json). Child repos do NOT need to copy a caller, and cannot modify it.
# Also serves as CI for this .github repo itself.
name: org-pr-convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: write

jobs:
  org:
    uses: Blended-Asia/.github/.github/workflows/pr-convention.yml@v1
