# Reusable: security baseline for every repo (does not depend on GitHub Advanced Security).
#   secrets       – TruffleHog scans the diff/commits for secrets + blocks committed .env files + public vars leaking secrets
#   dependencies  – Trivy scans lockfiles for CVEs (npm/pnpm/yarn/pip/go/...)
#   sast          – Semgrep; on PRs only reports findings that are NEW relative to base (baseline)
# To suppress accepted findings: .trivyignore, // nosemgrep, .semgrepignore in the child repo.
name: security

on:
  workflow_call:
    inputs:
      fail_severity:
        description: CVE severities that fail the check (Trivy)
        type: string
        default: HIGH,CRITICAL
      ignore_unfixed:
        description: Ignore CVEs that have no fix yet
        type: boolean
        default: true
      semgrep:
        type: boolean
        default: true
      semgrep_config:
        description: Semgrep rulesets (space-separated)
        type: string
        default: p/default
      semgrep_severity:
        description: Semgrep finding severity that fails the check
        type: string
        default: ERROR
      env_file_allowlist:
        description: Regex of .env files that may be committed
        type: string
        default: '\.env(\.[^/.]+)*\.(example|sample|template|defaults)$'
      public_env_prefixes:
        description: Env var prefixes that get bundled into the client
        type: string
        default: NEXT_PUBLIC_|VITE_|EXPO_PUBLIC_|PUBLIC_|REACT_APP_|NUXT_PUBLIC_
      fail_on:
        description: "On PRs: new = block only CVEs new relative to the base lockfile (existing debt is only reported) · all = block every CVE"
        type: string
        default: new
      trufflehog_version:
        description: TruffleHog image version for the weekly full-history scan (keep in sync with the action pin)
        type: string
        default: "3.97.9"
      trivy_version:
        type: string
        default: "0.75.0"
      semgrep_version:
        type: string
        default: "1.179.0"

permissions:
  contents: read

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}

jobs:
  secrets:
    name: secrets
    runs-on: ${{ vars.HARNESS_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog (verified + unknown secrets)
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          # The action does not handle merge_group itself → pass base/head explicitly so it doesn't rescan the whole history
          base: ${{ github.event.merge_group.base_sha || '' }}
          head: ${{ github.event.merge_group.head_sha || '' }}
          extra_args: --results=verified,unknown

      # Weekly schedule / manual run: scan the WHOLE git history (all branches checked out by fetch-depth: 0),
      # catching secrets that slipped past the local hook and PR checks. Fails on verified secrets only.
      - name: TruffleHog full history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.trufflehog_version }}
        run: |
          out="$RUNNER_TEMP/trufflehog.jsonl"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -e HOME=/tmp \
            "ghcr.io/trufflesecurity/trufflehog:$VERSION" git file:///repo --results=verified,unknown --json --no-update >"$out" || true
          OUT="$out" python3 - <<'PY'
          # ---- secrets-history:begin ----
          import json, os, sys
          verified, unknown = [], []
          for line in open(os.environ["OUT"], encoding="utf-8", errors="replace"):
              line = line.strip()
              if not line.startswith("{"):
                  continue
              try:
                  r = json.loads(line)
              except ValueError:
                  continue
              git = (r.get("SourceMetadata") or {}).get("Data", {}).get("Git", {})
              f = {"file": git.get("file", ""), "line": git.get("line") or 0, "commit": (git.get("commit") or "")[:7],
                   "detector": r.get("DetectorName", "unknown")}
              (verified if r.get("Verified") else unknown).append(f)
          for level, items in (("error", verified), ("warning", unknown)):
              for f in items:
                  what = "Verified (live) secret" if level == "error" else "Possible secret (unverified)"
                  loc = f"file={f['file']},line={f['line']}," if f["file"] else ""
                  print(f"::{level} {loc}title=trufflehog {f['detector']}::{what} in commit {f['commit']}. Rotate it, then remove it from history if needed.")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as s:
                  s.write(f"### Full-history secret scan: {len(verified)} verified, {len(unknown)} unverified\n")
          print(f"{len(verified)} verified, {len(unknown)} unverified")
          sys.exit(1 if verified else 0)
          # ---- secrets-history:end ----
          PY

      - name: No committed .env files / .vercel directory
        env:
          ALLOW: ${{ inputs.env_file_allowlist }}
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env(\.[^/]+)?$' | grep -vE "$ALLOW" || true)
          vercel=$(git ls-files | grep -E '(^|/)\.vercel/' || true)
          rc=0
          for f in $bad; do echo "::error file=$f::Env file is committed. Remove it from git (git rm --cached), add it to .gitignore and ROTATE the secrets it contains."; rc=1; done
          for f in $vercel; do echo "::error file=$f::The .vercel/ directory must not be committed (it may contain .env.*.local from 'vercel pull')."; rc=1; done
          [ $rc -eq 0 ] && echo "OK: no committed env/.vercel files"
          exit $rc

      - name: Public variables must not have secret-like names
        env:
          PREFIXES: ${{ inputs.public_env_prefixes }}
        run: |
          # e.g. NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY → gets bundled into client-side JS.
          # PR: only added lines are checked (existing debt doesn't block every PR). Push/schedule: scan the whole repo.
          python3 - <<'PY'
          # ---- public-env:begin ----
          import os, re, subprocess, sys
          base = os.environ.get("BASE_SHA", "")
          pattern = re.compile(r"\b(" + os.environ["PREFIXES"] + r")[A-Z0-9_]*(SERVICE_ROLE|SECRET|PRIVATE|PASSWORD|DB_URL|DATABASE_URL)[A-Z0-9_]*\b")
          specs = ["*.ts", "*.tsx", "*.js", "*.jsx", "*.mjs", "*.cjs", "*.vue", "*.svelte", "*.astro", "*.env*",
                   ":(exclude,glob)**/node_modules/**", ":(exclude,glob)**/tests/**", ":(exclude,glob)**/__tests__/**",
                   ":(exclude,glob)**/*.test.*", ":(exclude,glob)**/*.spec.*"]
          hits = []
          if base:
              out = subprocess.run(["git", "-c", "core.quotePath=false", "diff", "-U0", "--no-color", f"{base}...HEAD", "--", *specs],
                                   capture_output=True, text=True, check=True).stdout
              f, n = None, 0
              for l in out.split("\n"):
                  if l.startswith("+++ "):
                      f = None if l == "+++ /dev/null" else l[6:]
                  elif l.startswith("@@"):
                      n = int(re.search(r"\+(\d+)", l).group(1))
                  elif f and l.startswith("+"):
                      if pattern.search(l[1:]): hits.append((f, n))
                      n += 1
          else:
              # Don't use `git grep -E`: BSD/macOS ERE has no `\b` → matches would be missed.
              files = subprocess.run(["git", "-c", "core.quotePath=false", "ls-files", "-z", "--", *specs],
                                     capture_output=True, text=True, check=True).stdout.split("\0")
              for f in filter(None, files):
                  try:
                      with open(f, encoding="utf-8", errors="replace") as fh:
                          for n, l in enumerate(fh, 1):
                              if pattern.search(l): hits.append((f, n))
                  except (IsADirectoryError, FileNotFoundError):
                      pass
          for f, n in hits:
              print(f"::error file={f},line={n}::Variable has a public prefix but a secret-like name; it will be exposed to the browser.")
          print("OK" if not hits else f"{len(hits)} violation(s)")
          sys.exit(1 if hits else 0)
          # ---- public-env:end ----
          PY

  dependencies:
    name: dependencies
    runs-on: ${{ vars.HARNESS_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trivy filesystem scan (PR and base)
        env:
          TRIVY_VERSION: ${{ inputs.trivy_version }}
          SEVERITY: ${{ inputs.fail_severity }}
          IGNORE_UNFIXED: ${{ inputs.ignore_unfixed }}
          FAIL_ON: ${{ inputs.fail_on }}
        run: |
          out="$RUNNER_TEMP/trivy"; mkdir -p "$out" "$RUNNER_TEMP/trivy-cache"
          # --config points to an empty file: a trivy.yaml in the PR must not disable/skip files when scanning itself
          : > "$out/empty.yaml"
          args=(fs --config /out/empty.yaml --scanners vuln --severity "$SEVERITY" --format json --skip-dirs node_modules --exit-code 0)
          [ "$IGNORE_UNFIXED" = "true" ] && args+=(--ignore-unfixed)
          scan() {
            docker run --rm -v "$1:/src" -v "$out:/out" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -w /src \
              "ghcr.io/aquasecurity/trivy:${TRIVY_VERSION}" "${args[@]}" --output "/out/$2" .
          }
          scan "$PWD" head.json
          if [ -n "$BASE_SHA" ] && [ "$FAIL_ON" = "new" ]; then
            # Scan the base lockfile so only CVEs introduced by the PR block; pre-existing CVEs are only reported
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
            scan "$RUNNER_TEMP/base" base.json
          fi

      - name: Report + verdict
        env:
          SEV: ${{ inputs.fail_severity }}
        run: |
          python3 - <<'PY'
          # ---- trivy-vuln:begin ----
          import json, os, sys
          from collections import Counter
          out = os.path.join(os.environ["RUNNER_TEMP"], "trivy")
          def rows_of(path):
              data = json.load(open(path))
              return [(v["Severity"], r["Target"], v["PkgName"], v.get("InstalledVersion", ""), v.get("FixedVersion") or "-", v["VulnerabilityID"])
                      for r in data.get("Results") or [] for v in r.get("Vulnerabilities") or []]
          rows = sorted(rows_of(os.path.join(out, "head.json")), key=lambda x: (x[0] != "CRITICAL", x[1], x[2]))
          base_path = os.path.join(out, "base.json")
          # Count occurrences (not a set): adding a second copy of the same package + CVE is still a new finding
          left = Counter((t, p, vid) for _, t, p, _, _, vid in rows_of(base_path)) if os.path.exists(base_path) else None
          new, old = [], []
          for r in rows:
              k = (r[1], r[2], r[5])
              if left is not None and left[k] > 0:
                  left[k] -= 1
                  old.append(r)
              else:
                  new.append(r)
          table = lambda rs: "| Severity | File | Package | Installed | Fixed in | ID |\n|---|---|---|---|---|---|\n" + "".join("| " + " | ".join(r) + " |\n" for r in rs[:50]) + (f"\n…and {len(rs)-50} more\n" if len(rs) > 50 else "")
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as s:
              sev = os.environ.get("SEV", "HIGH,CRITICAL")
              if left is None:
                  s.write(f"### Dependencies: {len(rows)} vulnerabilities ({sev})\n\n" + (table(rows) if rows else ""))
              else:
                  s.write(f"### Dependencies: {len(new)} NEW vulnerabilities from this PR, {len(old)} pre-existing on base ({sev})\n\n")
                  if new: s.write("**New (blocking):**\n\n" + table(new) + "\n")
                  if old: s.write(f"<details><summary>Pre-existing debt (not blocking): {len(old)}</summary>\n\n" + table(old) + "\n</details>\n")
          for sev, target, pkg, inst, fix, vid in new:
              print(f"::error file={target}::{vid} {sev} {pkg}@{inst} → upgrade to {fix}")
          if old:
              print(f"::warning::{len(old)} pre-existing vulnerabilit{'y' if len(old) == 1 else 'ies'} (not blocking this PR). See the summary and the weekly report.")
          sys.exit(1 if new else 0)
          # ---- trivy-vuln:end ----
          PY

  sast:
    name: sast
    if: inputs.semgrep
    runs-on: ${{ vars.HARNESS_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semgrep
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep_version }}
          CONFIGS: ${{ inputs.semgrep_config }}
          SEVERITY: ${{ inputs.semgrep_severity }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          args=(scan --metrics=off --error --severity "$SEVERITY" --exclude node_modules)
          for c in $CONFIGS; do args+=(--config "$c"); done
          # On PRs: only fail on findings new relative to base; existing debt doesn't have to be fixed
          [ -n "$BASE_SHA" ] && args+=(--baseline-commit "$BASE_SHA")
          pipx run --spec "semgrep==${SEMGREP_VERSION}" semgrep "${args[@]}"
