# Reusable: per-stack checks + architecture scan, configured by the repo's .github/harness.yml.
#   plan          – read config, detect profiles (rails / react / node) and their directories
#   architecture  – architecture rules (all languages); by default only lines added/modified in the PR
#   rails         – RuboCop, Brakeman, Packwerk (one job per Rails directory)
#   js            – ESLint, tsc, Prettier, dependency-cruiser (one job per JS/TS directory)
# Scripts and default profiles come from the org's .github repo at ref `harness_ref` (that repo must be public).
# On PRs, .github/harness.yml is read from the BASE commit: a PR cannot loosen the rules that grade it.
name: stack

on:
  workflow_call:
    inputs:
      harness_ref:
        description: Ref of the .github repo containing scripts/harness and profiles (keep in sync with the workflow's @ref)
        type: string
        default: v1
      config_path:
        type: string
        default: .github/harness.yml

permissions:
  contents: read

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
  CONFIG_PATH: ${{ inputs.config_path }}

jobs:
  plan:
    name: plan
    runs-on: ${{ vars.HARNESS_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      rails: ${{ steps.plan.outputs.rails }}
      js: ${{ steps.plan.outputs.js }}
      scope: ${{ steps.plan.outputs.scope }}
      granularity: ${{ steps.plan.outputs.granularity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs the base commit: harness.yml is read from base so a PR cannot loosen it
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: ${{ inputs.harness_ref }}
          path: .harness
          sparse-checkout: |
            scripts/harness
            profiles
          persist-credentials: false
      # Move it out of the workspace so the repo's ESLint/Prettier don't scan harness code by mistake
      - run: mv .harness "$RUNNER_TEMP/harness"
      - id: plan
        env:
          HARNESS_DIR: ${{ runner.temp }}/harness
        run: node "$HARNESS_DIR/scripts/harness/config.mjs" plan

  architecture:
    name: architecture
    needs: plan
    runs-on: ${{ vars.HARNESS_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: ${{ inputs.harness_ref }}
          path: .harness
          sparse-checkout: |
            scripts/harness
            profiles
          persist-credentials: false
      # Move it out of the workspace so the repo's ESLint/Prettier don't scan harness code by mistake
      - run: mv .harness "$RUNNER_TEMP/harness"
      - name: Architecture rules
        env:
          HARNESS_DIR: ${{ runner.temp }}/harness
        run: |
          HARNESS_CONFIG_OUT="$RUNNER_TEMP/harness.json" node "$HARNESS_DIR/scripts/harness/config.mjs" plan > /dev/null
          HARNESS_CONFIG="$RUNNER_TEMP/harness.json" node "$HARNESS_DIR/scripts/harness/rules.mjs"

  rails:
    name: rails (${{ matrix.path }})
    needs: plan
    if: needs.plan.outputs.rails != '[]'
    runs-on: ${{ vars.HARNESS_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.rails) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: ${{ inputs.harness_ref }}
          path: .harness
          sparse-checkout: |
            scripts/harness
            profiles
          persist-credentials: false
      # Move it out of the workspace so the repo's ESLint/Prettier don't scan harness code by mistake
      - run: mv .harness "$RUNNER_TEMP/harness"
      - name: Ruby version
        id: rv
        env:
          DIR: ${{ matrix.path }}
        run: |
          # ---- ruby-version:begin ----
          # Order: version file in the app directory (setup-ruby reads it itself) → .ruby-version/.tool-versions at the repo root
          #        → `ruby "x.y.z"` in the app's Gemfile → 3.4
          if [ -f "$DIR/.ruby-version" ] || [ -f "$DIR/.tool-versions" ] || [ -f "$DIR/mise.toml" ]; then
            v=default
          elif [ -f .ruby-version ]; then
            v=$(head -n1 .ruby-version)
          elif [ -f .tool-versions ] && grep -qE '^ruby[[:space:]]' .tool-versions; then
            v=$(grep -E '^ruby[[:space:]]' .tool-versions | head -n1 | awk '{print $2}')
          elif [ -f "$DIR/Gemfile" ] && grep -qE '^[[:space:]]*ruby[[:space:]]+["'"'"'][0-9]' "$DIR/Gemfile"; then
            v=$(grep -E '^[[:space:]]*ruby[[:space:]]+["'"'"'][0-9]' "$DIR/Gemfile" | head -n1 | sed -E 's/^[[:space:]]*ruby[[:space:]]+["'"'"']([^"'"'"']+).*/\1/')
          else
            v=3.4
          fi
          v=${v#ruby-}
          # only accept valid version characters (prevents injecting newlines into GITHUB_OUTPUT)
          if ! printf '%s' "$v" | grep -qE '^[A-Za-z0-9._-]+$'; then v=3.4; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # ---- ruby-version:end ----
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ steps.rv.outputs.version }}
          working-directory: ${{ matrix.path }}
          bundler-cache: true
      - name: RuboCop · Brakeman · Packwerk
        env:
          PROFILE_PATH: ${{ matrix.path }}
          PROFILE_NAME: rails
          CHECKS: ${{ toJSON(matrix.checks) }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          GRANULARITY: ${{ needs.plan.outputs.granularity }}
          HARNESS_DIR: ${{ runner.temp }}/harness
        run: node "$HARNESS_DIR/scripts/harness/stack.mjs" rails

  js:
    name: ${{ matrix.name }} (${{ matrix.path }})
    needs: plan
    if: needs.plan.outputs.js != '[]'
    runs-on: ${{ vars.HARNESS_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.js) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: ${{ inputs.harness_ref }}
          path: .harness
          sparse-checkout: |
            scripts/harness
            profiles
          persist-credentials: false
      # Move it out of the workspace so the repo's ESLint/Prettier don't scan harness code by mistake
      - run: mv .harness "$RUNNER_TEMP/harness"
      - name: Node version
        id: nv
        env:
          DIR: ${{ matrix.path }}
        run: |
          # ---- node-version:begin ----
          f=""
          for c in "$DIR/.nvmrc" "$DIR/.node-version" ".nvmrc" ".node-version"; do [ -f "$c" ] && { f="$c"; break; }; done
          echo "file=$f" >> "$GITHUB_OUTPUT"
          # npm cache keyed on the nearest package-lock.json (app dir up to the repo root, same lookup as detectPM).
          # Only npm: setup-node's pnpm/yarn cache needs the tool installed before this step.
          d=$DIR lock=""
          while :; do
            for l in pnpm-lock.yaml yarn.lock bun.lock bun.lockb package-lock.json; do
              if [ -f "$d/$l" ]; then lock="$d/$l"; break 2; fi
            done
            [ "$d" = "." ] && break
            d=$(dirname "$d")
          done
          case "$lock" in
            */package-lock.json) { echo "cache=npm"; echo "lock=${lock#./}"; } >> "$GITHUB_OUTPUT" ;;
            *) { echo "cache="; echo "lock="; } >> "$GITHUB_OUTPUT" ;;
          esac
          # ---- node-version:end ----
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ steps.nv.outputs.file }}
          node-version: ${{ steps.nv.outputs.file == '' && '24' || '' }}
          cache: ${{ steps.nv.outputs.cache }}
          cache-dependency-path: ${{ steps.nv.outputs.lock }}
      - name: ESLint · tsc · Prettier · dependency-cruiser
        env:
          PROFILE_PATH: ${{ matrix.path }}
          PROFILE_NAME: ${{ matrix.name }}
          CHECKS: ${{ toJSON(matrix.checks) }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          GRANULARITY: ${{ needs.plan.outputs.granularity }}
          HARNESS_DIR: ${{ runner.temp }}/harness
        run: node "$HARNESS_DIR/scripts/harness/stack.mjs" js
