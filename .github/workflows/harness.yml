# Reusable: gate của harness. Gọi SAU các job check (needs) với if: always().
# Required check trên ruleset: "harness / gate".
#   - Reject: check đỏ + sticky comment liệt kê lỗi (lấy từ annotation của mọi job trong run).
#   - Đạt: bot approve nếu rủi ro thấp, bật auto-merge (GitHub merge khi đủ required checks + review).
#   - AI review (tuỳ chọn, review.ai: true trong .github/harness.yml): chỉ có quyền chặn.
name: harness

on:
  workflow_call:
    inputs:
      results:
        description: toJSON(needs) của caller
        type: string
        default: "{}"
      harness_ref:
        type: string
        default: v1
      config_path:
        type: string
        default: .github/harness.yml
    secrets:
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      HARNESS_APP_PRIVATE_KEY:
        required: false

jobs:
  gate:
    # Chỉ run của PR/merge queue mới mang đúng tên required check "harness / gate".
    # Run từ push/schedule/"Run workflow" thành "harness / gate (push)"… nên không làm xanh check của PR được.
    name: ${{ contains(fromJSON('["pull_request","merge_group"]'), github.event_name) && 'gate' || format('gate ({0})', github.event_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # bật auto-merge khi không dùng GitHub App
      pull-requests: write   # comment, review
      actions: read          # đọc job + annotation của run
      checks: read
      issues: read           # ai gắn label override
    env:
      HARNESS_APP_CLIENT_ID: ${{ vars.HARNESS_APP_CLIENT_ID }}
      HAS_APP_KEY: ${{ secrets.HARNESS_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0 # policy + ARCHITECTURE.md đọc từ commit base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: ${{ inputs.harness_ref }}
          path: .harness
          sparse-checkout: |
            scripts/harness
            profiles
          persist-credentials: false
      - run: mv .harness "$RUNNER_TEMP/harness"

      # Approve/merge bằng GitHub App (khuyên dùng): merge do App thực hiện vẫn kích hoạt workflow trên main,
      # còn merge bằng GITHUB_TOKEN thì không. App cần: Contents R/W, Pull requests R/W.
      - name: Token GitHub App
        id: app
        if: env.HARNESS_APP_CLIENT_ID != '' && env.HAS_APP_KEY == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HARNESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}

      - name: Verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS_WRITE_TOKEN: ${{ steps.app.outputs.token }}
          HARNESS_BOT_LOGIN: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESULTS: ${{ inputs.results }}
          HARNESS_DIR: ${{ runner.temp }}/harness
          REPO_DIR: repo
          CONFIG_PATH: ${{ inputs.config_path }}
        run: node "$HARNESS_DIR/scripts/harness/verdict.mjs"
