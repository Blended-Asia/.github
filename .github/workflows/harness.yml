# Reusable: the harness gate. Call it AFTER the check jobs (needs) with if: always().
# Required check in the ruleset: "harness / gate".
#   - Reject: red check + sticky comment listing errors (taken from annotations of every job in the run).
#   - Pass: bot approves if low-risk, enables auto-merge (GitHub merges once required checks + reviews pass).
#   - AI review (optional, review.ai: true in .github/harness.yml): can only block.
name: harness

on:
  workflow_call:
    inputs:
      results:
        description: toJSON(needs) from the caller
        type: string
        default: "{}"
      harness_ref:
        type: string
        default: v1
      config_path:
        type: string
        default: .github/harness.yml
    secrets:
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      HARNESS_APP_PRIVATE_KEY:
        required: false

jobs:
  gate:
    # Only PR/merge queue runs carry the exact required check name "harness / gate".
    # Runs from push/schedule/"Run workflow" become "harness / gate (push)"… so they cannot turn a PR's check green.
    name: ${{ contains(fromJSON('["pull_request","merge_group"]'), github.event_name) && 'gate' || format('gate ({0})', github.event_name) }}
    runs-on: ${{ vars.HARNESS_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write        # enable auto-merge when no GitHub App is used
      pull-requests: write   # comment, review
      actions: read          # read the run's jobs + annotations
      checks: read
      issues: read           # who applied the override label
    env:
      HARNESS_APP_CLIENT_ID: ${{ vars.HARNESS_APP_CLIENT_ID }}
      HAS_APP_KEY: ${{ secrets.HARNESS_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0 # policy + ARCHITECTURE.md are read from the base commit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: ${{ inputs.harness_ref }}
          path: .harness
          sparse-checkout: |
            scripts/harness
            profiles
          persist-credentials: false
      - run: mv .harness "$RUNNER_TEMP/harness"

      # Approve/merge via a GitHub App (recommended): merges made by the App still trigger workflows on main,
      # while merges made with GITHUB_TOKEN do not. The App needs: Contents R/W, Pull requests R/W.
      - name: GitHub App token
        id: app
        if: env.HARNESS_APP_CLIENT_ID != '' && env.HAS_APP_KEY == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HARNESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}

      - name: Verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS_WRITE_TOKEN: ${{ steps.app.outputs.token }}
          HARNESS_BOT_LOGIN: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESULTS: ${{ inputs.results }}
          HARNESS_DIR: ${{ runner.temp }}/harness
          REPO_DIR: repo
          CONFIG_PATH: ${{ inputs.config_path }}
        run: node "$HARNESS_DIR/scripts/harness/verdict.mjs"
