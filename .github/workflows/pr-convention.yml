# Reusable: checks PRs against the org convention.
# Called from child repos via workflow-templates/org-pr-convention.yml
# Check name shown on the PR: "org / pr-convention"
name: pr-convention

on:
  workflow_call:
    inputs:
      title_types:
        description: Allowed Conventional Commits types (comma-separated)
        type: string
        default: feat,fix,chore,docs,refactor,perf,test,build,ci,revert,style
      require_scope:
        type: boolean
        default: false
      allowed_scopes:
        description: Allowed scopes; empty = any scope
        type: string
        default: ""
      title_max_length:
        type: number
        default: 72
      branch_pattern:
        description: Regex for the source branch name; empty = not checked
        type: string
        default: '^(feat|fix|chore|docs|refactor|perf|test|build|ci|hotfix|release|revert)/[a-z0-9._-]+$'
      ticket_pattern:
        description: "Ticket ID regex (e.g. Backlog/Jira: '[A-Z][A-Z0-9_]+-[0-9]+'); empty = not required"
        type: string
        default: ""
      ticket_in:
        description: Where to look for the ticket ID (title, branch, body)
        type: string
        default: title,branch,body
      required_sections:
        description: Headings that must exist with content in the PR body (comma- or newline-separated)
        type: string
        default: "## Summary,## How to test"
      require_checklist_done:
        description: Fail if the body still has unticked "- [ ]" checkboxes
        type: boolean
        default: false
      max_changed_lines:
        type: number
        default: 800
      size_mode:
        description: warn | fail | off
        type: string
        default: warn
      size_exclude:
        description: Globs of files excluded from the PR size
        type: string
        default: "package-lock.json,pnpm-lock.yaml,yarn.lock,bun.lock,bun.lockb,*.snap,*.min.js,**/generated/**,**/database.types.ts"
      size_labels:
        description: Automatically apply size/XS..XL labels
        type: boolean
        default: true
      check_commits:
        description: Check every commit message (usually unnecessary with squash merges)
        type: boolean
        default: false
      ignore_bots:
        type: boolean
        default: true
      comment:
        description: Post a sticky comment summarizing problems on the PR
        type: boolean
        default: true
      config_path:
        description: The repo's harness config file (gate.branches is read at the base commit)
        type: string
        default: .github/harness.yml

jobs:
  check:
    name: pr-convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # gate.branches is read from harness.yml at the BASE commit (a PR cannot change which branches are gated)
      - name: Gated branches
        id: gate
        if: github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          # ---- gate-branches:begin ----
          raw=$(gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/$CONFIG_PATH?ref=$BASE_SHA" 2>/dev/null || true)
          # shellcheck disable=SC2016 # $stdin belongs to Ruby, not a shell variable
          branches=$(printf '%s' "$raw" | ruby -ryaml -rjson -e '
            c = (YAML.safe_load($stdin.read) rescue nil)
            b = c.is_a?(Hash) && c["gate"].is_a?(Hash) ? c["gate"]["branches"] : nil
            puts JSON.generate(b.is_a?(Array) ? b.map(&:to_s) : [])')
          echo "branches=$branches" >> "$GITHUB_OUTPUT"
          echo "gate.branches (base): $branches"
          # ---- gate-branches:end ----

      - name: Check PR convention
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUTS: ${{ toJSON(inputs) }}
          GATE_BRANCHES: ${{ steps.gate.outputs.branches }}
        with:
          script: |
            // ---- org-pr-convention:begin ----
            if (!context.payload.pull_request) {
              core.info(`Event ${context.eventName}: no PR payload; the convention was already checked on the PR.`);
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // Always read the current PR state: re-running an old run (stale payload) cannot turn a since-broken PR green
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.payload.pull_request.number });
            // Only gate PRs into branches in gate.branches (default: the default branch). Other branches → skip, no comment.
            const gateBranches = JSON.parse(process.env.GATE_BRANCHES || '[]');
            const defaultBranch = context.payload.repository?.default_branch;
            const allowed = gateBranches.length ? gateBranches : (defaultBranch ? [defaultBranch] : []);
            const branchRe = (g) => new RegExp(`^${g.split('**').map((a) => a.split('*').map((b) => b.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('[^/]*')).join('.*')}$`);
            if (allowed.length && pr.base?.ref && !allowed.some((g) => branchRe(g).test(pr.base.ref))) {
              core.info(`Base \`${pr.base.ref}\` is not in gate.branches (${allowed.join(', ')}): skipping the convention check.`);
              await core.summary.addRaw(`### org / pr-convention: skipped — base \`${pr.base.ref}\` is not gated (${allowed.join(', ')})\n`).write();
              return;
            }
            const I = JSON.parse(process.env.INPUTS);
            const MARKER = '<!-- org-pr-convention -->';
            const list = (s) => String(s ?? '').split(/[\n,]/).map((x) => x.trim()).filter(Boolean);
            const count = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
            const errors = [];
            const warnings = [];

            const isBot = pr.user?.type === 'Bot' || /\[bot\]$/.test(pr.user?.login ?? '');
            if (I.ignore_bots && isBot) {
              core.info(`Bot PR (${pr.user.login}), skipping the convention check.`);
              return;
            }

            // 1) Title: Conventional Commits
            const types = list(I.title_types);
            const title = pr.title.trim();
            const m = title.match(/^([a-z]+)(?:\(([^()\s]+)\))?(!)?: (\S.*)$/);
            if (!m) {
              errors.push(['Title', `\`${title}\` does not match \`type(scope): description\`. Valid types: ${types.join(', ')}`]);
            } else {
              const [, type, scope, , subject] = m;
              if (!types.includes(type)) errors.push(['Title', `type \`${type}\` is not allowed. Use one of: ${types.join(', ')}`]);
              if (I.require_scope && !scope) errors.push(['Title', 'missing scope, e.g. `feat(auth): ...`']);
              const scopes = list(I.allowed_scopes);
              if (scope && scopes.length && !scopes.includes(scope)) errors.push(['Title', `scope \`${scope}\` is not one of: ${scopes.join(', ')}`]);
              if (/[.。]$/.test(subject)) warnings.push(['Title', 'should not end with a period']);
            }
            if (title.length > I.title_max_length) errors.push(['Title', `is ${title.length} characters long (max ${I.title_max_length})`]);

            // 2) Branch name
            const branch = pr.head.ref;
            if (I.branch_pattern && !new RegExp(I.branch_pattern).test(branch)) {
              errors.push(['Branch', `\`${branch}\` does not match \`${I.branch_pattern}\``]);
            }

            // 3) Body sections + checklist
            const rawBody = (pr.body ?? '').replace(/\r\n/g, '\n');
            const body = rawBody.replace(/<!--[\s\S]*?-->/g, '');
            const isHeading = (l) => /^#{1,6}\s+\S/.test(l);
            const norm = (h) => h.replace(/^#{1,6}\s*/, '').trim().toLowerCase();
            const sectionContent = (md, heading) => {
              const lines = md.split('\n');
              const start = lines.findIndex((l) => isHeading(l) && norm(l) === norm(heading));
              if (start < 0) return null;
              const out = [];
              for (let i = start + 1; i < lines.length && !isHeading(lines[i]); i++) out.push(lines[i]);
              return out.join('\n').trim();
            };
            for (const sec of list(I.required_sections)) {
              const c = sectionContent(body, sec);
              if (c === null) errors.push(['Body', `missing section \`${sec}\``]);
              else if (!c) errors.push(['Body', `section \`${sec}\` is empty (write "N/A" if not applicable)`]);
            }
            if (I.require_checklist_done && /^\s*[-*] \[ \]/m.test(body)) {
              errors.push(['Checklist', 'has unticked `- [ ]` items']);
            }

            // 4) Ticket
            if (I.ticket_pattern) {
              const re = new RegExp(I.ticket_pattern);
              const hay = { title, branch, body };
              const where = list(I.ticket_in);
              if (!where.some((w) => re.test(hay[w] ?? ''))) {
                errors.push(['Ticket', `no ticket ID matching \`${I.ticket_pattern}\` found in ${where.join('/')}`]);
              }
            }

            // 5) Size (ignores lockfiles and generated files)
            const globToRe = (g) => {
              const anchored = g.includes('/');
              let s = g.replace(/[.+^${}()|[\]\\]/g, '\\$&')
                .replace(/\*\*\//g, '\u0001').replace(/\*\*/g, '\u0002')
                .replace(/\*/g, '\u0003').replace(/\?/g, '\u0004');
              s = s.replace(/\u0001/g, '(?:.*/)?').replace(/\u0002/g, '.*')
                .replace(/\u0003/g, '[^/]*').replace(/\u0004/g, '[^/]');
              return new RegExp(`^${anchored ? '' : '(?:.*/)?'}${s}$`);
            };
            let changed = pr.additions + pr.deletions;
            if (I.size_mode !== 'off' || I.size_labels) {
              try {
                const excludes = list(I.size_exclude).map(globToRe);
                const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
                changed = files.filter((f) => !excludes.some((re) => re.test(f.filename)))
                  .reduce((n, f) => n + f.additions + f.deletions, 0);
              } catch (e) {
                core.warning(`Could not list files, using total additions+deletions: ${e.message}`);
              }
              if (I.size_mode !== 'off' && changed > I.max_changed_lines) {
                const item = ['Size', `${changed} lines changed (limit ${I.max_changed_lines}). Consider splitting the PR`];
                (I.size_mode === 'fail' ? errors : warnings).push(item);
              }
            }

            // 6) Commit messages (optional)
            if (I.check_commits) {
              const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number, per_page: 100 });
              const re = new RegExp(`^(${types.join('|')})(\\([^()\\s]+\\))?!?: \\S`);
              const bad = commits.map((c) => c.commit.message.split('\n')[0])
                .filter((msg) => !re.test(msg) && !/^(Merge|Revert) /.test(msg));
              if (bad.length) errors.push(['Commits', `${count(bad.length, 'commit')} with a bad format, e.g. \`${bad[0]}\``]);
            }

            // ---- Report ----
            const draft = pr.draft === true;
            const ok = errors.length === 0;
            const rows = [...errors.map(([k, v]) => `| ❌ | ${k} | ${v} |`), ...warnings.map(([k, v]) => `| ⚠️ | ${k} | ${v} |`)];
            const head = ok
              ? (warnings.length ? `### ✅ PR convention: passed (${count(warnings.length, 'warning')})` : '### ✅ PR convention: passed')
              : `### ❌ PR convention: ${count(errors.length, 'error')}${warnings.length ? `, ${count(warnings.length, 'warning')}` : ''}`;
            const note = draft && !ok ? '\n\n> This PR is a draft: not blocking yet; it will be enforced once marked Ready for review.' : '';
            const table = rows.length ? `\n\n| | Check | Details |\n|---|---|---|\n${rows.join('\n')}` : '';
            const md = `${MARKER}\n${head}${table}${note}\n\n<sub>Org convention · editing the title/body re-runs this check automatically.</sub>`;
            await core.summary.addRaw(md.replace(MARKER, '')).write();

            if (I.size_labels) {
              const size = changed <= 50 ? 'XS' : changed <= 200 ? 'S' : changed <= 500 ? 'M' : changed <= 1000 ? 'L' : 'XL';
              try {
                const want = `size/${size}`;
                const current = pr.labels.map((l) => l.name);
                for (const l of current.filter((n) => n.startsWith('size/') && n !== want)) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: l });
                }
                if (!current.includes(want)) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [want] });
              } catch (e) {
                core.info(`Skipping labels (token lacks write access, e.g. a fork PR): ${e.message}`);
              }
            }

            if (I.comment) {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
                const prev = comments.find((c) => c.body?.startsWith(MARKER));
                if (prev && prev.body !== md) await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body: md });
                else if (!prev && rows.length) await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: md });
              } catch (e) {
                core.info(`Skipping comment (token lacks write access): ${e.message}`);
              }
            }

            for (const [k, v] of warnings) core.warning(`${k}: ${v}`);
            if (!ok) {
              for (const [k, v] of errors) (draft ? core.warning : core.error)(`${k}: ${v}`);
              if (!draft) core.setFailed(`PR does not meet the convention (${count(errors.length, 'error')})`);
            }
            // ---- org-pr-convention:end ----
