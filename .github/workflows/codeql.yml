# Reusable (opt-in): CodeQL. Free for public repos; private repos need GitHub Code Security.
# Kept separate because it needs the security-events: write permission (the caller must grant it).
name: codeql

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array, e.g. ["javascript-typescript","python","actions"]'
        type: string
        default: '["javascript-typescript","actions"]'

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ${{ vars.HARNESS_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
