# Reusable: kiểm tra Vercel Preview sau khi deploy xong (trigger: deployment_status).
# Không cần token Vercel. Nếu preview bật Deployment Protection, tạo
# "Protection Bypass for Automation" trong Vercel và lưu vào secret VERCEL_AUTOMATION_BYPASS_SECRET.
name: vercel-preview

on:
  workflow_call:
    inputs:
      url:
        type: string
        required: true
      paths:
        description: Các trang cần kiểm tra header
        type: string
        default: /
      fail_on_missing_recommended:
        description: Fail luôn khi thiếu CSP / Referrer-Policy / Permissions-Policy
        type: boolean
        default: false
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false

permissions:
  contents: read

jobs:
  headers:
    name: preview-headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kiểm tra security headers + đường dẫn nhạy cảm
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          URL: ${{ inputs.url }}
          PATHS: ${{ inputs.paths }}
          STRICT: ${{ inputs.fail_on_missing_recommended }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          script: |
            // ---- vercel-preview:begin ----
            const base = new URL(process.env.URL);
            const strict = process.env.STRICT === 'true';
            const headers = process.env.BYPASS ? { 'x-vercel-protection-bypass': process.env.BYPASS } : {};
            const get = (p, redirect = 'follow') => fetch(new URL(p, base), { headers, redirect });
            const errors = [];
            const warns = [];
            const rows = [];

            for (const p of process.env.PATHS.split(',').map((s) => s.trim()).filter(Boolean)) {
              const r = await get(p);
              if (r.status === 401 || r.status === 403) {
                errors.push(`${p}: HTTP ${r.status}, preview đang bị Deployment Protection chặn. Thêm secret VERCEL_AUTOMATION_BYPASS_SECRET.`);
                continue;
              }
              if (r.status >= 400) { errors.push(`${p}: HTTP ${r.status}`); continue; }
              const h = (n) => r.headers.get(n);
              const csp = h('content-security-policy') ?? '';
              const checks = [
                ['Strict-Transport-Security', !!h('strict-transport-security'), true],
                ['X-Content-Type-Options: nosniff', (h('x-content-type-options') ?? '').toLowerCase() === 'nosniff', true],
                ['Chống clickjacking (X-Frame-Options hoặc CSP frame-ancestors)', !!h('x-frame-options') || /frame-ancestors/i.test(csp), true],
                ['Content-Security-Policy', !!csp, strict],
                ['Referrer-Policy', !!h('referrer-policy'), strict],
                ['Permissions-Policy', !!h('permissions-policy'), strict],
                ['Không lộ X-Powered-By', !h('x-powered-by'), false],
              ];
              for (const [name, ok, required] of checks) {
                rows.push(`| ${ok ? '✅' : required ? '❌' : '⚠️'} | \`${p}\` | ${name} |`);
                if (!ok) (required ? errors : warns).push(`${p}: thiếu ${name}`);
              }
            }

            // File nhạy cảm: chỉ báo khi nội dung trả về đúng là file đó (tránh false positive do SPA fallback)
            const sensitive = [
              ['/.env', /^[A-Z_][A-Z0-9_]*=/m],
              ['/.env.local', /^[A-Z_][A-Z0-9_]*=/m],
              ['/.env.production', /^[A-Z_][A-Z0-9_]*=/m],
              ['/.git/config', /\[core\]/],
              ['/.git/HEAD', /^ref: refs\//],
              ['/.vercel/project.json', /"projectId"/],
            ];
            for (const [p, sig] of sensitive) {
              const r = await get(p, 'manual');
              const leaked = r.status === 200 && sig.test(await r.text());
              rows.push(`| ${leaked ? '❌' : '✅'} | \`${p}\` | Không public file nhạy cảm |`);
              if (leaked) errors.push(`${p} đang public trên preview!`);
            }

            await core.summary
              .addRaw(`### Vercel preview: ${base.origin}\n\n| | Path | Kiểm tra |\n|---|---|---|\n${rows.join('\n')}\n`)
              .write();
            warns.forEach((w) => core.warning(w));
            if (errors.length) {
              errors.forEach((e) => core.error(e));
              core.setFailed(`${errors.length} vấn đề bảo mật trên preview`);
            }
            // ---- vercel-preview:end ----
