# Chỉ dùng cho GitHub Enterprise Cloud: ruleset "Require workflows to pass" trỏ vào file này
# (xem rulesets/org-baseline-enterprise.json). Repo con không cần caller và không sửa được.
name: org-harness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  security:
    uses: Blended-Asia/.github/.github/workflows/security.yml@v1
  infra:
    uses: Blended-Asia/.github/.github/workflows/infra.yml@v1
  stack:
    uses: Blended-Asia/.github/.github/workflows/stack.yml@v1
  harness:
    needs: [security, infra, stack]
    if: always()
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      issues: read
    uses: Blended-Asia/.github/.github/workflows/harness.yml@v1
    with:
      results: ${{ toJSON(needs) }}
    secrets: inherit
