# Managed by the org — do not edit directly; change config via `with:` below.
name: org-pr-convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: org-pr-convention-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  org:
    uses: Blended-Asia/.github/.github/workflows/pr-convention.yml@v1
