# Managed by the org. Runs after a successful Vercel preview deploy (advisory check, not required).
name: org-vercel-preview

on:
  deployment_status:

permissions:
  contents: read

jobs:
  preview:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.creator.login == 'vercel[bot]'
    uses: Blended-Asia/.github/.github/workflows/vercel-preview.yml@v1
    with:
      url: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      # paths: /,/login
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
