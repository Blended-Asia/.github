# Managed by the org — do not edit directly. Repo config lives in .github/harness.yml.
# Required check in the ruleset: "harness / gate"
name: org-harness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [$default-branch]
  schedule:
    - cron: "17 1 * * 1" # Monday 08:17 Vietnam time (UTC+7): rescan running code for new CVEs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: Blended-Asia/.github/.github/workflows/security.yml@v1

  infra:
    uses: Blended-Asia/.github/.github/workflows/infra.yml@v1

  stack:
    uses: Blended-Asia/.github/.github/workflows/stack.yml@v1

  harness:
    needs: [security, infra, stack]
    if: always()
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      issues: read
    uses: Blended-Asia/.github/.github/workflows/harness.yml@v1
    with:
      results: ${{ toJSON(needs) }}
    secrets: inherit
