# Starter RuboCop config for Rails. Add to the Gemfile (group :development, :test):
#   gem "rubocop-rails-omakase", require: false
# The Gemfile needs a `ruby file: ".ruby-version"` line (included by default since Rails 7.1); otherwise RuboCop
# parses with Ruby 2.7 syntax and reports bogus Lint/Syntax errors.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

# Additional org conventions
Rails/Output:
  Enabled: true
Lint/Debugger:
  Enabled: true
