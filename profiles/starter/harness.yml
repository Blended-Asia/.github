# .github/harness.yml — harness configuration for this repo.
# Every key is optional. Leave it out = use the org defaults (profiles/base.yml + the stack's profile).
# This file is read from the base branch: changes made in a PR only take effect AFTER that PR is merged.

# Start in observe mode: the harness comments "would block because…" but does not block merges.
# After 1–2 weeks, once false positives are tuned out, switch to enforce (see docs/onboarding-existing-repo.md).
enforcement: observe

# Gated branches. Leave out = default branch. Git-flow repos (working on develop):
# gate:
#   branches: [develop]

# The repo's stacks. Leave out to auto-detect:
#   Gemfile with rails → rails · package.json with react/next → react · other package.json → node
# Monorepo: declare each directory.
# profiles:
#   - name: rails
#     path: api
#   - name: react
#     path: web

convention:
  scope: changed            # changed | all

# Enable/disable tools per profile
# checks:
#   react:
#     prettier: false
#   rails:
#     brakeman: true

architecture:
  disable: []               # disable default rules by id, e.g. [react/no-ts-ignore]
  rules: []                 # repo-specific rules (paths relative to the repo root), for example:
  # - id: web/features-isolated
  #   paths: ["web/src/features/**"]
  #   forbid: 'from\s+["'']@/features/(?!shared/)'
  #   message: Features must not import another feature's internals; go through @/features/shared.
  #   severity: error

review:
  ai: false                 # enable AI review (OPENAI_API_KEY secret; see profiles/base.yml for provider/model)
  guidelines: ARCHITECTURE.md

merge:
  auto: true
  bot_approve:
    enabled: true
    max_lines: 200
    authors: []             # e.g. ["renovate[bot]"] to have the bot approve only PRs by these authors
  # human_required_paths: replaces the entire default list if declared
