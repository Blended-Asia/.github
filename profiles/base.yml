# Shared defaults for every repo. A repo overrides them with .github/harness.yml (same structure).

# enforce: the gate is red until checks pass; the bot approves + auto-merges when they do.
# observe: grades and comments as usual but does NOT block and does NOT approve/merge — use when onboarding an existing repo.
enforcement: enforce
gate:
  branches: []              # PRs into which branches are gated. [] = default branch. Git-flow repos: [develop]. Globs supported (release/*).
                            # PRs into other branches: harness / gate and org / pr-convention are green, no comments, no approve/merge.
convention:
  scope: changed            # changed: only flag problems in lines/files changed by the PR · all: the whole repo
  granularity: line         # line: lint/format/tsc only block problems on modified lines or new compared to base (suits existing repos)
                            # file: every file the PR touches must be fully clean (suits new repos)

review:
  ai: false                 # true: enable AI review (needs the OPENAI_API_KEY secret, or ANTHROPIC_API_KEY if provider: anthropic)
  provider: openai          # openai (Chat Completions + Structured Outputs) | anthropic
  diff_exclude:             # excluded from the diff sent to the AI (noisy, costs tokens). Lockfiles always require a human reviewer anyway.
    - "**/package-lock.json"
    - "**/pnpm-lock.yaml"
    - "**/yarn.lock"
    - "**/bun.lock"
    - "**/Gemfile.lock"
  model: ""                 # empty = provider default (DEFAULT_MODELS in scripts/harness/verdict.mjs)
  language: en              # language the AI writes review comments in
  block_on: [critical, major]
  guidelines: ARCHITECTURE.md   # architecture doc the AI checks against (if present)
  max_diff_chars: 120000
  fail_closed: false        # true: block merge if the AI errors/times out
  override_label: "harness:override-ai"   # someone with maintain/admin permission (not the PR author) applies this label to override AI blockers

merge:
  auto: true                # harness passes → enable auto-merge (GitHub still waits for all required checks + reviews)
  method: squash            # squash | merge | rebase
  bot_approve:              # the bot approves in place of a human when ALL conditions are met
    enabled: true
    max_lines: 200          # total changed lines across all files (including generated files)
    authors: []             # empty = any author; e.g. ["renovate[bot]", "my-agent[bot]"]
  # Touching these paths → the bot never approves; a human must review.
  # Always added (cannot be disabled): .github/**, CODEOWNERS.
  human_required_paths:
    # data, infrastructure, security
    - "**/migrations/**"
    - "**/db/migrate/**"        # **/ matches both the root and subdirectories (e.g. jfoodhub/db/migrate)
    - "**/db/schema.rb"
    - "**/db/structure.sql"
    - "**/supabase/**"
    - "**/auth/**"
    - "**/config/credentials/**"
    - "**/config/credentials.yml.enc"
    - "**/config/master.key"
    - "**/config/initializers/**"
    - "Dockerfile"
    - "**/Dockerfile*"
    # dependencies (manifests + lockfiles: prevents sneaky resolved/integrity changes)
    - "**/package.json"
    - "**/Gemfile"
    - "**/Gemfile.lock"
    - "**/package-lock.json"
    - "**/pnpm-lock.yaml"
    - "**/yarn.lock"
    - "**/bun.lock"
    - "**/.npmrc"
    - "**/.yarnrc*"
    # config of the grading tools themselves and "ignore" files
    - "**/.rubocop*.yml"
    - "**/eslint.config.*"
    - "**/.eslintrc*"
    - "**/.eslintignore"
    - "**/tsconfig*.json"
    - "**/.prettier*"
    - "**/prettier.config.*"
    - "**/.dependency-cruiser.*"
    - "**/config/brakeman.ignore"
    - "**/packwerk.yml"
    - "**/package_todo.yml"
    - "**/.trivyignore*"
    - "**/trivy.y*ml"
    - "**/.semgrepignore"
    - "**/.hadolint.y*ml"
  # New lines containing these markers → need a human reviewer (checks are being intentionally disabled)
  suppression_markers:
    - "harness-disable-line"
    - "nosemgrep"
    - "eslint-disable"
    - "rubocop:disable"
    - "@ts-ignore"
    - "@ts-nocheck"
    - "@ts-expect-error"
    - "/* eslint "
    - "/*eslint "
    - "eslint-env"
    - "rubocop:todo"
    - "brakeman:ignore"
    - "trivy:ignore"
    - "prettier-ignore"
    - "hadolint ignore"
  # Only used to display "size" (does not affect the bot-approve threshold)
  size_exclude:
    - "**/package-lock.json"
    - "**/pnpm-lock.yaml"
    - "**/yarn.lock"
    - "**/bun.lock"
    - "**/Gemfile.lock"
    - "**/*.snap"
    - "**/generated/**"
    - "**/database.types.ts"
    - "**/db/schema.rb"
    - "**/db/structure.sql"
