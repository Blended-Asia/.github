# Node.js profile (APIs, workers, scripts).
checks:
  eslint: true
  typecheck: true
  prettier: true
  depcruise: true
  depcruise_dirs: [src, lib, server, app]

architecture:
  rules:
    - id: node/no-sql-string-building
      security: true            # security rule: cannot be disabled or downgraded when onboarding
      paths: ["**/*.{ts,js,mjs,cjs}"]
      exclude: ["**/*.test.*", "**/*.spec.*", "**/migrations/**"]
      forbid: '\.(query|execute|raw|unsafe)\(\s*`[^`]*\$\{|\.(query|execute|raw|unsafe)\(\s*["''][^"'']*["'']\s*\+'
      message: Do not concatenate strings into SQL. Use parameterized queries ($1, ?) or a query builder.
      severity: error

    - id: node/no-console-log
      paths: ["src/**/*.{ts,js,mjs}"]
      exclude: ["**/*.test.*", "**/*.spec.*", "**/scripts/**"]
      forbid: '\bconsole\.(log|debug)\('
      message: Use a leveled logger instead of console.log.
      severity: warn
