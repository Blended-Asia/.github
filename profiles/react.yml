# React / Next.js / Vite profile.
checks:
  eslint: true              # uses the repo's config (eslint.config.*); missing config → warning
  typecheck: true           # tsc --noEmit if tsconfig.json exists
  prettier: true            # only if the repo has a prettier config
  depcruise: true           # dependency-cruiser: import cycles, devDependencies imported into production code...
  depcruise_dirs: [src, app, lib, components, pages, server, hooks, features]

architecture:
  rules:
    - id: react/client-no-server-code
      security: true            # security rule: cannot be disabled or downgraded when onboarding
      paths: ["**/*.{ts,tsx,js,jsx}"]
      if_file_matches: '^\s*["'']use client["'']'
      forbid: 'process\.env\.(?!NEXT_PUBLIC_|NODE_ENV\b)[A-Z_]+|SERVICE_ROLE|from\s+["''](server-only|@/server/|@/lib/db|@/db/)'
      message: Client components must not read server-side env, service role keys or import server code. Move the logic to a Server Component, Server Action or route handler.
      severity: error

    - id: react/shared-components-no-route-import
      paths: ["src/components/**", "components/**"]
      forbid: 'from\s+["''](@/|(\.\./)+)(app|pages)/'
      message: Shared components/ must not depend on routes (app/, pages/). Move shared code down into components/ or lib/.
      severity: error

    - id: react/no-dangerous-html
      security: true            # security rule: cannot be disabled or downgraded when onboarding
      paths: ["**/*.{tsx,jsx}"]
      forbid: 'dangerouslySetInnerHTML'
      message: dangerouslySetInnerHTML is prone to XSS. Sanitize it (e.g. DOMPurify) and document the data source.
      severity: warn

    - id: react/no-ts-ignore
      paths: ["**/*.{ts,tsx}"]
      forbid: '@ts-ignore'
      message: Use `// @ts-expect-error <reason>` instead of @ts-ignore.
      severity: warn
